name: Automated Hourly News & Sitemap Update

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  hourly-sync:
    name: Sync Real-Time Market News & Sitemaps
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Trigger Live Vercel Cron Endpoint (Sync MongoDB & Production Feeds)
        run: |
          echo "Triggering live production cron at https://worldstocknews.online/api/cron..."
          RESPONSE=$(curl -s -S --max-time 30 -X GET "https://worldstocknews.online/api/cron" \
            -H "User-Agent: GitHubActions-HourlyCron/2.0" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "Response from live Vercel cron:"
          echo "$RESPONSE"

      - name: Run Hourly Ingestion & Regeneration Engine (Local File Sync)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node scripts/hourly-update.js

      - name: Commit and push hourly updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml feed.xml feed.json js/articles-data.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto-update): hourly refresh of sitemap, feeds, and market wire [skip ci]"
            git push origin main
            echo "Hourly updates committed and pushed successfully."
          else
            echo "No changes detected this cycle."
          fi
